<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corrigator - Suivi des resultats</title>
  <link rel="icon" type="image/png" href="corrigator_icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d4ea0">
  <link rel="stylesheet" href="style.css?v=20260609b">
</head>
<body>

<nav>
  <div class="nav-brand-row">
    <h1 class="brand">
      <a href="index.html" aria-label="Accueil Corrigator">
        <img src="corrigator_logo.png" alt="Corrigator" class="brand-logo">
      </a>
    </h1>
    <button class="nav-toggle" id="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
  </div>
  <div class="nav-collapse" id="nav-collapse">
    <a href="index.html">Accueil</a>
    <a href="devoirs.html">Devoirs</a>
    <a href="etudiants.html">Etudiants</a>
    <a href="suivi-resultats.html">Suivi</a>
    <a href="aide.html">Aide</a>
    <div class="nav-sync-actions">
      <button id="sync-pull-btn" class="btn btn-neutral btn-sm" onclick="syncPull()" style="display:none">Pull</button>
      <button id="sync-push-btn" class="btn btn-primary btn-sm" onclick="syncPush()" style="display:none">Push</button>
      <span id="sync-status" class="nav-sync-status">Etat sync...</span>
    </div>
  </div>
</nav>
<script>
(function(){
  var toggle = document.getElementById("nav-toggle");
  var nav = toggle && toggle.closest("nav");
  if (!toggle || !nav) return;
  toggle.addEventListener("click", function(){
    var open = nav.classList.toggle("nav-open");
    toggle.setAttribute("aria-expanded", open);
    toggle.textContent = open ? "✕" : "☰";
  });
  document.querySelectorAll("#nav-collapse a").forEach(function(a){
    a.addEventListener("click", function(){
      nav.classList.remove("nav-open");
      toggle.textContent = "☰";
      toggle.setAttribute("aria-expanded", "false");
    });
  });
})();
</script>

<main>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem">
      <h2 style="margin:0">Suivi des resultats</h2>
      <button class="btn btn-neutral btn-sm" id="reload-btn">Actualiser</button>
    </div>
    <div class="form-row" style="margin-bottom:.75rem">
      <label for="filter-group-name" style="color:#555;font-size:.9rem;align-self:center">Groupe</label>
      <select id="filter-group-name" style="flex:1;min-width:180px;padding:.45rem .7rem;border:1px solid #ccc;border-radius:6px">
        <option value="">Tous les groupes</option>
      </select>
      <label for="filter-year" style="color:#555;font-size:.9rem;align-self:center">Annee</label>
      <select id="filter-year" style="flex:1;min-width:180px;padding:.45rem .7rem;border:1px solid #ccc;border-radius:6px">
        <option value="">Toutes les annees</option>
      </select>
    </div>
    <p id="suivi-meta" style="color:#5a6472;font-size:.9rem;margin:.25rem 0 .75rem 0">Chargement...</p>
    <div id="suivi-zone"><p style="color:#888">Chargement...</p></div>
  </div>
</main>

<div id="toast"></div>

<script src="dropbox-sync.js"></script>
<script src="local-api.js"></script>
<script src="pwa-register.js"></script>
<script src="sync-nav.js"></script>
<script src="dropbox-config-ui.js"></script>
<script>
const API = "http://localhost:8000";

let allGroupes = [];
let allEtudiants = [];
let allDevoirs = [];
const resultatsByDevoir = new Map();
const resultatsMapByDevoir = new Map();

function toast(msg, duration) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, duration || 2000);
}

function normYear(v) {
  const txt = String(v == null ? "" : v).trim();
  return txt || "";
}

function groupeLabel(g) {
  if (!g) return "";
  if (g.label) return String(g.label);
  const nom = String(g.nom || "").trim();
  const year = normYear(g.annee_scolaire);
  return year ? nom + " (" + year + ")" : nom;
}

function groupById(id) {
  return allGroupes.find(function(g){ return Number(g.id) === Number(id); }) || null;
}

function memberships(etudiant) {
  const ids = Array.isArray(etudiant.groupe_ids)
    ? etudiant.groupe_ids
    : (etudiant.groupe_id != null ? [etudiant.groupe_id] : []);
  return ids.map(groupById).filter(function(g){ return Boolean(g); });
}

function loadFilterOptions() {
  const groupNames = [];
  const seenNames = new Set();
  const years = [];
  const seenYears = new Set();

  for (const g of allGroupes) {
    const name = String(g.nom || "").trim();
    const year = normYear(g.annee_scolaire);
    if (name && !seenNames.has(name)) {
      seenNames.add(name);
      groupNames.push(name);
    }
    if (year && !seenYears.has(year)) {
      seenYears.add(year);
      years.push(year);
    }
  }

  groupNames.sort(function(a, b){ return a.localeCompare(b, "fr", { sensitivity: "base" }); });
  years.sort(function(a, b){ return a.localeCompare(b, "fr", { sensitivity: "base" }); });

  const groupSel = document.getElementById("filter-group-name");
  const yearSel = document.getElementById("filter-year");
  const previousGroup = groupSel.value;
  const previousYear = yearSel.value;

  groupSel.innerHTML = '<option value="">Tous les groupes</option>';
  yearSel.innerHTML = '<option value="">Toutes les annees</option>';

  for (const name of groupNames) {
    groupSel.appendChild(new Option(name, name));
  }
  for (const year of years) {
    yearSel.appendChild(new Option(year, year));
  }

  if (previousGroup && groupNames.includes(previousGroup)) groupSel.value = previousGroup;
  if (previousYear && years.includes(previousYear)) yearSel.value = previousYear;
}

function filteredEtudiants() {
  const groupName = document.getElementById("filter-group-name").value;
  const year = document.getElementById("filter-year").value;

  return allEtudiants
    .filter(function(e){
      const m = memberships(e);
      if (!groupName && !year) return true;
      return m.some(function(g){
        const matchesGroup = !groupName || String(g.nom || "").trim() === groupName;
        const matchesYear = !year || normYear(g.annee_scolaire) === year;
        return matchesGroup && matchesYear;
      });
    })
    .sort(function(a, b){
      const n = String(a.nom || "").localeCompare(String(b.nom || ""), "fr", { sensitivity: "base" });
      if (n !== 0) return n;
      return String(a.prenom || "").localeCompare(String(b.prenom || ""), "fr", { sensitivity: "base" });
    });
}

function devoirsAvecNotes(etudiants) {
  const selectedIds = new Set(etudiants.map(function(e){ return Number(e.id); }));
  return allDevoirs.filter(function(d){
    const rows = resultatsByDevoir.get(Number(d.id)) || [];
    return rows.some(function(r){
      return selectedIds.has(Number(r.etudiant && r.etudiant.id)) && Boolean(r.copie_corrigee);
    });
  });
}

function noteCellText(row) {
  if (!row || !row.copie_corrigee) return "";
  const n = Number(row.note_sur_20 || 0);
  return n.toFixed(1).replace(/\.0$/, "");
}

function noteCellStyle(row) {
  if (!row || !row.copie_corrigee) return "";
  const n = Number(row.note_sur_20 || 0);
  const normalized = Math.max(0, Math.min(1, n / 20));
  const hue = Math.round(normalized * 120);
  return "background:hsl(" + hue + ", 90%, 50%);color:#111";
}

function buildCorrectionUrl(devoirId, etudiantId) {
  return "corriger.html?devoir=" + encodeURIComponent(devoirId) + "&etudiant=" + encodeURIComponent(etudiantId) + "&source=suivi";
}

function renderTable() {
  const etudiants = filteredEtudiants();
  const devoirs = devoirsAvecNotes(etudiants)
    .slice()
    .sort(function(a, b){
      const ua = Number(a.updated_at_ms || 0);
      const ub = Number(b.updated_at_ms || 0);
      if (ua !== ub) return ub - ua;
      return Number(b.id || 0) - Number(a.id || 0);
    });

  const meta = document.getElementById("suivi-meta");
  meta.textContent = etudiants.length + " etudiant(s) affiches · " + devoirs.length + " devoir(s) avec note";

  const zone = document.getElementById("suivi-zone");
  if (!etudiants.length) {
    zone.innerHTML = '<p style="color:#888">Aucun etudiant pour ce filtre.</p>';
    return;
  }

  if (!devoirs.length) {
    zone.innerHTML = '<p style="color:#888">Aucun devoir avec note pour ce filtre.</p>';
    return;
  }

  const headDevoirs = devoirs.map(function(d, idx){
    const titre = String(d.titre || "Devoir").replace(/"/g, "&quot;");
    return '<th class="suivi-devoir-head" title="' + titre + '">D' + String(idx + 1) + '</th>';
  }).join("");

  const bodyRows = etudiants.map(function(e){
    const cells = devoirs.map(function(d){
      const map = resultatsMapByDevoir.get(Number(d.id));
      const row = map ? map.get(Number(e.id)) : null;
      const text = noteCellText(row);
      const cls = text ? "suivi-note-value" : "suivi-note-empty";
      const style = noteCellStyle(row);
      const styleAttr = style ? ' style="' + style + '"' : "";
      return '<td class="' + cls + ' suivi-note-click" data-devoir-id="' + Number(d.id) + '" data-etudiant-id="' + Number(e.id) + '" title="Ouvrir la correction"' + styleAttr + '>' + (text || '&nbsp;') + '</td>';
    }).join("");

    return '<tr>'
      + '<td class="suivi-student-name">' + String(e.nom || "") + ' ' + String(e.prenom || "") + '</td>'
      + cells
      + '</tr>';
  }).join("");

  zone.innerHTML = ''
    + '<div class="suivi-scroll">'
    + '  <table class="suivi-table">'
    + '    <thead><tr><th>Etudiant</th>' + headDevoirs + '</tr></thead>'
    + '    <tbody>' + bodyRows + '</tbody>'
    + '  </table>'
    + '</div>';
}

async function loadData() {
  const [groupesRes, etudiantsRes, devoirsRes] = await Promise.all([
    fetch(API + "/groupes"),
    fetch(API + "/etudiants"),
    fetch(API + "/devoirs"),
  ]);

  if (!groupesRes.ok || !etudiantsRes.ok || !devoirsRes.ok) {
    throw new Error("Chargement principal impossible");
  }

  const [groupes, etudiants, devoirs] = await Promise.all([
    groupesRes.json(),
    etudiantsRes.json(),
    devoirsRes.json(),
  ]);

  allGroupes = groupes;
  allEtudiants = etudiants;
  allDevoirs = devoirs;

  resultatsByDevoir.clear();
  resultatsMapByDevoir.clear();

  await Promise.all(devoirs.map(async function(d){
    const res = await fetch(API + "/devoirs/" + d.id + "/resultats");
    if (!res.ok) {
      resultatsByDevoir.set(Number(d.id), []);
      resultatsMapByDevoir.set(Number(d.id), new Map());
      return;
    }
    const rows = await res.json();
    resultatsByDevoir.set(Number(d.id), rows);
    const map = new Map();
    for (const r of rows) {
      map.set(Number(r.etudiant && r.etudiant.id), r);
    }
    resultatsMapByDevoir.set(Number(d.id), map);
  }));
}

async function refreshAll() {
  const zone = document.getElementById("suivi-zone");
  zone.innerHTML = '<p style="color:#888">Chargement...</p>';
  try {
    await loadData();
    loadFilterOptions();
    renderTable();
  } catch (err) {
    zone.innerHTML = '<p style="color:#b42318">' + err.message + '</p>';
    toast(err.message, 2600);
  }
}

document.getElementById("reload-btn").addEventListener("click", refreshAll);
document.getElementById("filter-group-name").addEventListener("change", renderTable);
document.getElementById("filter-year").addEventListener("change", renderTable);

document.getElementById("suivi-zone").addEventListener("click", function(event){
  const cell = event.target.closest("td.suivi-note-click[data-devoir-id][data-etudiant-id]");
  if (!cell) return;
  const devoir = cell.getAttribute("data-devoir-id");
  const etudiant = cell.getAttribute("data-etudiant-id");
  if (!devoir || !etudiant) return;
  location.href = buildCorrectionUrl(devoir, etudiant);
});

(async function init(){
  initSyncNav({ afterPull: function(){ location.reload(); } });
  await refreshAll();
})();
</script>
</body>
</html>
